name: Update demo data

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC
  workflow_dispatch:       # adds a "Run workflow" button for manual runs

permissions:
  contents: write          # lets the job save the refreshed file

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the demo data
        run: python scripts/update_demo_data.py

      - name: Save changes, if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/demo.json
          git diff --staged --quiet || (git commit -m "Refresh demo data $(date -u +%F)" && git push)
